name: Update profile statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate statistics
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_USERNAME: am4nd6
        run: python scripts/generate_stats.py
      - name: Commit statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg
          git diff --cached --quiet || git commit -m "Update profile statistics"
          git push
